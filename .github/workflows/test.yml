name: Test Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build script
        run: python3 build.py
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app.apk
