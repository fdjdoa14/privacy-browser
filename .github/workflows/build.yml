name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Find Python entry point
        id: find_py
        run: |
          if [ -f "main.py" ]; then
            echo "entry=main.py" >> $GITHUB_OUTPUT
          elif [ -f "app.py" ]; then
            echo "entry=app.py" >> $GITHUB_OUTPUT
          else
            echo "entry=$(find . -name '*.py' -not -path './.git/*' | head -1)" >> $GITHUB_OUTPUT
          fi
      
      - name: Install dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
      
      - name: Build EXE
        if: contains(github.ref, 'v')
        run: |
          pyinstaller --onefile --noconfirm ${{ steps.find_py.outputs.entry }}
          mv dist/*.exe . || true
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Build APK
        if: contains(github.ref, 'v') && exists('build.gradle')
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi
      
      - name: Create Release
        if: contains(github.ref, 'v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.exe
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
